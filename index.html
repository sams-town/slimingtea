<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#6366f1" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="HCW Manager" />
  <title>Homecare Weight Management</title>

  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png" />

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand:   { DEFAULT: '#6366f1', dark: '#4f46e5', light: '#818cf8' },
            surface: { DEFAULT: '#1e293b', dark: '#0f172a', light: '#334155' }
          }
        }
      }
    }
  </script>

  <!-- Custom CSS -->
  <link rel="stylesheet" href="assets/css/app.css" />
</head>

<body class="bg-slate-900 text-slate-100 min-h-screen">

  <!-- ═══════════════════════════════════════════════════════
       SIDEBAR
  ════════════════════════════════════════════════════════ -->
  <aside id="sidebar"
    class="fixed top-0 left-0 h-full w-64 bg-slate-800 border-r border-slate-700
           z-50 transform -translate-x-full transition-transform duration-300
           md:translate-x-0 flex flex-col"
    aria-label="Navigasi utama">

    <!-- Logo -->
    <div class="flex items-center gap-3 px-5 py-4 border-b border-slate-700 flex-shrink-0">
      <div class="w-9 h-9 rounded-xl bg-indigo-600 flex items-center justify-center flex-shrink-0">
        <svg class="w-5 h-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0
               002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2
               2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2
               2 0 01-2-2z"/>
        </svg>
      </div>
      <div>
        <p class="text-sm font-bold leading-tight text-white">Homecare WMS</p>
        <p class="text-xs text-slate-400">Weight Management</p>
      </div>
    </div>

    <!-- Nav Links -->
    <nav class="flex-1 overflow-y-auto p-3 space-y-0.5" role="navigation">

      <!-- Daftar Pasien -->
      <a href="#" data-page="patients"
        class="nav-link flex items-center gap-3 px-3 py-3 rounded-xl
               text-slate-300 hover:bg-slate-700 hover:text-white transition-colors">
        <svg class="w-5 h-5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10
               0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0
               015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0
               0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/>
        </svg>
        <span class="text-sm font-medium">Daftar Pasien</span>
      </a>

      <!-- Detail Pasien (muncul setelah pilih pasien) -->
      <a href="#" data-page="patient-detail" id="nav-patient-detail"
        class="nav-link hidden flex items-center gap-3 px-3 py-3 rounded-xl
               text-slate-300 hover:bg-slate-700 hover:text-white transition-colors
               border border-indigo-700/30 bg-indigo-900/20">
        <svg class="w-5 h-5 flex-shrink-0 text-indigo-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
        </svg>
        <div class="min-w-0 flex-1">
          <p class="text-sm font-medium text-white truncate" id="nav-active-name">Profil Pasien</p>
          <p class="text-xs text-indigo-400">Kunjungan aktif</p>
        </div>
      </a>

      <!-- Divider: Data Klinis -->
      <div class="pt-2 pb-1">
        <p class="px-3 text-xs font-semibold text-slate-500 uppercase tracking-wider">
          Akses Cepat
        </p>
      </div>

      <!-- Assessment -->
      <a href="#" data-page="assessment"
        class="nav-link flex items-center gap-3 px-3 py-3 rounded-xl
               text-slate-300 hover:bg-slate-700 hover:text-white transition-colors">
        <svg class="w-5 h-5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0
               002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0
               002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"/>
        </svg>
        <span class="text-sm font-medium">Initial Assessment</span>
      </a>

      <!-- Monitoring -->
      <a href="#" data-page="monitoring"
        class="nav-link flex items-center gap-3 px-3 py-3 rounded-xl
               text-slate-300 hover:bg-slate-700 hover:text-white transition-colors">
        <svg class="w-5 h-5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0
               002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0
               012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0
               0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
        </svg>
        <span class="text-sm font-medium">Weekly Monitoring</span>
      </a>

      <!-- Foto & Catatan -->
      <a href="#" data-page="photos"
        class="nav-link flex items-center gap-3 px-3 py-3 rounded-xl
               text-slate-300 hover:bg-slate-700 hover:text-white transition-colors">
        <svg class="w-5 h-5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2
               2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2
               0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
        </svg>
        <span class="text-sm font-medium">Foto &amp; Catatan</span>
      </a>

    </nav>

    <!-- Sync Status (footer sidebar) -->
    <div class="flex-shrink-0 p-4 border-t border-slate-700 space-y-2">
      <div class="flex items-center justify-between">
        <span class="text-xs text-slate-400">Sinkronisasi</span>
        <button id="btn-manual-sync"
          class="text-xs text-indigo-400 hover:text-indigo-300
                 flex items-center gap-1 transition-colors">
          <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0
                 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
          </svg>
          Sync sekarang
        </button>
      </div>
      <div class="flex items-center gap-2">
        <span id="sync-dot" class="w-2 h-2 rounded-full badge-online flex-shrink-0"></span>
        <span id="sync-status-text" class="text-xs text-slate-300">Online</span>
      </div>
      <p id="sync-last-time" class="text-xs text-slate-500">—</p>
      <div id="sync-pending-badge" class="hidden text-xs text-amber-400">
        <span id="sync-pending-count">0</span> data belum tersinkron
      </div>
    </div>
  </aside>

  <!-- Sidebar overlay (mobile tap-to-close) -->
  <div id="drawer-overlay" onclick="closeSidebar()"></div>


  <!-- ═══════════════════════════════════════════════════════
       TOPBAR
  ════════════════════════════════════════════════════════ -->
  <header id="topbar"
    class="fixed top-0 left-0 right-0 md:left-64 h-14
           bg-slate-800/95 backdrop-blur border-b border-slate-700
           z-30 flex items-center px-4 gap-3">

    <!-- Hamburger (mobile) -->
    <button onclick="toggleSidebar()"
      class="md:hidden p-2 rounded-lg text-slate-400 hover:bg-slate-700"
      aria-label="Buka menu">
      <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M4 6h16M4 12h16M4 18h16"/>
      </svg>
    </button>

    <!-- Breadcrumb / Page Title -->
    <div class="flex-1 min-w-0">
      <h1 id="page-title" class="text-sm font-semibold text-white truncate">
        Daftar Pasien
      </h1>
      <p id="page-subtitle" class="text-xs text-slate-400 hidden truncate"></p>
    </div>

    <!-- Active Patient Pill -->
    <div id="active-patient-pill"
      class="hidden items-center gap-2 bg-slate-700/80 rounded-full px-3 py-1.5
             cursor-pointer hover:bg-slate-600 transition-colors"
      onclick="App.goToPage('patient-detail')"
      title="Buka profil pasien">
      <div class="w-6 h-6 rounded-full bg-indigo-600 flex items-center
                  justify-center text-xs font-bold text-white"
        id="patient-pill-avatar">?</div>
      <span id="patient-pill-name"
        class="text-xs font-medium text-white max-w-[100px] truncate"></span>
      <svg class="w-3 h-3 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
      </svg>
    </div>

    <!-- Network indicator -->
    <div class="flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-slate-700/60
                flex-shrink-0">
      <span id="net-dot" class="w-2 h-2 rounded-full bg-emerald-500 flex-shrink-0"></span>
      <span id="net-label" class="text-xs text-slate-300">Online</span>
    </div>
  </header>


  <!-- ═══════════════════════════════════════════════════════
       MAIN CONTENT
  ════════════════════════════════════════════════════════ -->
  <main id="main-content" class="md:ml-64 pt-14 min-h-screen">

    <!-- ── PAGE: Daftar Pasien ── -->
    <div id="page-patients" class="page p-4 md:p-6">
      <!-- Diisi oleh UIPatients.render() -->
    </div>

    <!-- ── PAGE: Detail / Hub Pasien (3 tab di dalam) ── -->
    <div id="page-patient-detail" class="page hidden p-4 md:p-6">
      <!-- Diisi oleh UIPatientDetail.render() -->
    </div>

    <!-- ── PAGE: Initial Assessment (standalone, akses cepat) ── -->
    <div id="page-assessment" class="page hidden p-4 md:p-6">
      <!-- Diisi oleh UIAssessment.render() -->
    </div>

    <!-- ── PAGE: Weekly Monitoring (standalone, akses cepat) ── -->
    <div id="page-monitoring" class="page hidden p-4 md:p-6">
      <!-- Diisi oleh UIMonitoring.render() -->
    </div>

    <!-- ── PAGE: Foto & Catatan (standalone, akses cepat) ── -->
    <div id="page-photos" class="page hidden p-4 md:p-6">
      <!-- Diisi oleh UIPhotos.render() -->
    </div>

  </main>


  <!-- ═══════════════════════════════════════════════════════
       MODAL — Edit / Quick Register Pasien
  ════════════════════════════════════════════════════════ -->
  <div id="modal-patient"
    class="hidden fixed inset-0 z-50 items-center justify-center p-4"
    role="dialog" aria-modal="true" aria-labelledby="modal-patient-title">

    <!-- Backdrop -->
    <div class="absolute inset-0 bg-black/60 backdrop-blur-sm"
      onclick="closePatientModal()"></div>

    <!-- Panel -->
    <div class="relative bg-slate-800 rounded-2xl w-full max-w-xl
                max-h-[90vh] overflow-y-auto shadow-2xl border border-slate-700">

      <!-- Header modal -->
      <div class="sticky top-0 bg-slate-800 flex items-center justify-between
                  p-5 border-b border-slate-700 z-10">
        <h2 id="modal-patient-title" class="text-base font-bold text-white">
          Daftarkan Pasien
        </h2>
        <button onclick="closePatientModal()"
          class="p-2 rounded-lg hover:bg-slate-700 text-slate-400 transition-colors"
          aria-label="Tutup">
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>

      <!-- Body (diisi oleh UIPatients) -->
      <div id="modal-patient-body" class="p-5">
      </div>
    </div>
  </div>


  <!-- ═══════════════════════════════════════════════════════
       TOAST CONTAINER
  ════════════════════════════════════════════════════════ -->
  <div id="toast-container" aria-live="polite" aria-atomic="true"></div>


  <!-- ═══════════════════════════════════════════════════════
       SCRIPTS  (urutan loading penting!)
  ════════════════════════════════════════════════════════ -->

  <!-- Pondasi -->
  <script src="assets/js/utils.js"></script>
  <script src="assets/js/db.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/sync.js"></script>

  <!-- OCR (dimuat sebelum UI modules) -->
  <script src="assets/js/ocr.js"></script>
  <script src="assets/js/ui-ocr.js"></script>

  <!-- UI Modules -->
  <script src="assets/js/ui-assessment.js"></script>
  <script src="assets/js/ui-monitoring.js"></script>
  <script src="assets/js/ui-photos.js"></script>
  <script src="assets/js/ui-patient-detail.js"></script>
  <script src="assets/js/ui-patients.js"></script>

  <!-- App Router (terakhir, setelah semua modul siap) -->
  <script src="assets/js/app.js"></script>

</body>
</html>
